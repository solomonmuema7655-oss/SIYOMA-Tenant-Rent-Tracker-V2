name: Build SIYOMA Tenant Rent Tracker V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SIYOMA_Tenant_Rent_Tracker_V2*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No SIYOMA Tenant Rent Tracker V2 ZIP found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q -o "$ZIP"

          chmod +x gradlew

          echo "Project files:"
          ls -la

          echo "App module:"
          ls -la app

      - name: Fix Kotlin dependency conflict
        run: |
          cat >> app/build.gradle <<'EOF'

          // SIYOMA FIX: Resolve Kotlin duplicate-class dependency conflict
          configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion("1.8.22")
                  }
              }
          }
          EOF

          echo "Kotlin dependency fix applied."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
